name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint:check

      - run: npm run format:check

      - run: npm run types:check

      # Provider requests are stubbed and use placeholder credentials.
      - run: npm run test:provider-contracts

      - run: npm run test:image-providers

      - run: npm run test:desktop-contracts

      - run: npm run build
