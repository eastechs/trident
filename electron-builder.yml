appId: com.eastechs.trident
productName: Trident
copyright: Copyright © 2026 Eastechs

directories:
  output: release
  buildResources: resources

afterAllArtifactBuild: scripts/notarize-dmg.js
afterPack: scripts/update-metadata.js

publish:
  provider: github
  owner: eastechs
  repo: trident-releases
  releaseType: draft

files:
  - dist/**/*
  - node_modules/**/*
  - "!node_modules/**/*.{map,ts}"

extraResources:
  - from: resources/images/app-icon.png
    to: images/app-icon.png

mac:
  minimumSystemVersion: "13.0.0"
  category: public.app-category.productivity
  icon: resources/images/app-icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  notarize: true
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]

dmg:
  icon: resources/images/app-icon.png

win:
  icon: resources/images/app-icon.png
  target:
    - target: nsis
      arch: [x64]

linux:
  icon: resources/images/app-icon.png
  target:
    - target: AppImage
      arch: [x64]
  category: Office
